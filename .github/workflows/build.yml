name: build-and-push
on: workflow_dispatch
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free up disk space for the large image
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 2048
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          build-mount-path: /var/lib/docker
      - name: Restart docker on the big partition
        run: sudo service docker restart
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          docker build --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            -t ghcr.io/bowgull/comfyui-sdxl-worker:latest .
          docker push ghcr.io/bowgull/comfyui-sdxl-worker:latest
